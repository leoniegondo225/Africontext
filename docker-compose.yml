services:
  web:
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      - "3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Applique les migrations Prisma (prisma/migrations) avant le démarrage de l'application.
  migrate:
    build:
      context: .
      target: build
    env_file: .env
    command: ["pnpm", "db:migrate"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
        required: false

  # Nightly doc watch (F12): calls the watch endpoint with the cron secret.
  veille:
    image: alpine:3.20
    restart: unless-stopped
    env_file: .env
    command: >
      sh -c "apk add --no-cache curl >/dev/null &&
             echo '0 3 * * * curl -fsS -X POST http://web:3000/api/admin/watch -H \"x-cron-secret: $$CRON_SECRET\"' | crontab - &&
             crond -f"
    depends_on:
      - web

  # Base PostgreSQL locale (schéma Prisma dans prisma/), lancée avec `--profile local-db`.
  # Avec Supabase, ne pas l'activer : DATABASE_URL et DIRECT_URL pointent vers le projet Supabase.
  db:
    image: postgres:16-alpine
    profiles: ["local-db"]
    restart: unless-stopped
    environment:
      POSTGRES_DB: africontext
      POSTGRES_USER: africontext
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?définir POSTGRES_PASSWORD dans .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U africontext -d africontext"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
